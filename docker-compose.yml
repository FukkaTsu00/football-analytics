# Local infrastructure. Start: docker compose up -d   Stop: docker compose down
# Lesson 8 adds MinIO and Airflow to this file.

services:
  postgres-dw:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DW_USER}
      POSTGRES_PASSWORD: ${DW_PASSWORD}
      POSTGRES_DB: ${DW_DB}
    ports:
      - "5440:5432"   # your PC's port 5440 -> the container's 5432 (avoids clashing with a local Postgres)
    volumes:
      - postgres_dw_data:/var/lib/postgresql/data   # data survives 'docker compose down'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DW_USER} -d ${DW_DB}"]
      interval: 5s
      retries: 10

volumes:
  postgres_dw_data: