[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "football-analytics"
version = "0.1.0"
description = "Football news pipeline: Scrapy -> bronze/silver/gold -> Postgres, orchestrated by Airflow"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]   # style errors, real bugs (unused imports, undefined names...), common pitfalls
ignore = ["E501"]               # long lines are fine